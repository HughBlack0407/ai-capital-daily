<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI资本周报目录</title>
  <style>
    :root{--paper:#f7f5f0;--ink:#1b1d1e;--wine:#9b2237;--line:#d8d5cd;--muted:#666b6a}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 "Microsoft YaHei","PingFang SC",Arial,sans-serif}.shell{max-width:990px;margin:auto;padding:24px 26px 60px}
    .hero{background:#171c23;color:white;border-top:6px solid var(--wine);padding:42px 48px}.eyebrow{font:700 11px Arial,sans-serif;letter-spacing:.19em;color:#ef9daf}.hero h1{font-size:clamp(36px,5vw,56px);line-height:1.1;margin:18px 0 10px}.hero p{margin:0;color:#d4d8d9}.back{display:block;border-bottom:2px solid var(--ink);padding:15px 4px;color:var(--wine);font-weight:800;text-decoration:none}
    .section{padding-top:32px}.section h2{font-size:23px;margin:0 0 12px}.empty{background:white;border:1px solid var(--line);padding:28px}.empty strong{display:block;font-size:20px}.empty p{margin:8px 0 0;color:var(--muted)}footer{border-top:2px solid var(--ink);margin-top:42px;padding-top:14px;color:var(--muted);font-size:12px}a:focus-visible{outline:2px solid var(--wine);outline-offset:3px}
    @media(max-width:650px){.shell{padding:0 16px 35px}.hero{margin:0 -16px;padding:29px 22px}}
  </style>
</head>
<body><main class="shell"><header class="hero"><div class="eyebrow">AI CAPITAL / WEEKLY ARCHIVE</div><h1>周报目录</h1><p>按期次回看国内 AI 融资与资本运作线索</p></header><a class="back" href="../">← 返回周报首页</a><section class="section"><h2>已发布周报</h2><div class="empty"><strong>首期筹备中</strong><p>首期统计 2026 年 10 月 26 日 09:30 至 11 月 2 日 09:30，计划于 11 月 2 日采集完成后发布。发布成功后，这里会出现可打开的周报期次。</p></div></section><footer>逐日采集记录仅保存在本地；本目录只展示周报。</footer></main></body>
</html>
