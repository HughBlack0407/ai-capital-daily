<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI资本周报目录</title><style>
    :root{--paper:#f7f5f0;--ink:#1b1d1e;--wine:#9b2237;--line:#d8d5cd;--muted:#666b6a}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 "Microsoft YaHei","PingFang SC",Arial,sans-serif}
    .shell{max-width:1120px;margin:auto;padding:24px 26px 60px}.hero{background:#171c23;color:#fff;border-top:6px solid var(--wine);padding:45px 50px 48px}
    .eyebrow{font:700 11px Arial,sans-serif;letter-spacing:.19em;color:#ef9daf}.hero h1{font-size:clamp(38px,5vw,62px);line-height:1.1;margin:20px 0 12px}.hero p{margin:0;color:#d4d8d9;font-size:17px}
    .strip{display:flex;gap:24px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding:15px 4px;color:var(--muted);font-size:12px}.strip b{color:var(--ink)}
    .layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:42px;padding-top:34px}.rail{align-self:start}.rail strong{display:block;border-bottom:2px solid var(--ink);padding-bottom:9px;color:var(--wine);font:800 11px Arial,sans-serif;letter-spacing:.15em}.rail a{display:block;border-bottom:1px solid var(--line);padding:10px 2px;color:var(--ink);font-weight:800;text-decoration:none}.rail a:hover{color:var(--wine)}
    h2{font-size:24px;line-height:1.35;margin:0 0 14px}.lead{font-size:23px;line-height:1.5;font-weight:800;margin:0 0 17px}.note{color:var(--muted);font-size:13px}.callout{background:#fff;border:1px solid var(--line);border-left:4px solid var(--wine);padding:22px 26px;margin:27px 0 34px}.callout .label{color:var(--wine);font:800 11px Arial,sans-serif;letter-spacing:.15em}.callout h3{font-size:21px;margin:7px 0}.callout p{margin:7px 0 0}
    .section{border-top:2px solid var(--ink);padding-top:20px;margin-top:30px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.step{border-top:1px solid var(--line);padding-top:10px}.step b{color:var(--wine)}.step h3{margin:4px 0;font-size:17px}.step p{margin:0;color:var(--muted);font-size:13px}.directory-link{display:inline-block;margin-top:5px;padding:8px 16px;background:var(--wine);color:white;text-decoration:none;font-weight:800}.directory-link:hover{background:#751b2a}
    footer{border-top:2px solid var(--ink);margin-top:42px;padding-top:14px;color:var(--muted);font-size:12px}a:focus-visible{outline:2px solid var(--wine);outline-offset:3px}
    @media(max-width:760px){.shell{padding:0 16px 35px}.hero{margin:0 -16px;padding:29px 22px}.layout{grid-template-columns:1fr;gap:15px}.rail a{display:inline-block;margin-right:20px}.lead{font-size:19px}.steps{grid-template-columns:1fr}}

    .tag{display:inline-block;background:#f1e1e4;color:#7e1f31;padding:2px 9px;font-size:11px;font-weight:800;margin:0 8px 8px 0}
    .story{border-bottom:1px solid var(--line);padding:20px 0 24px}.story h3{font-size:21px;line-height:1.4;margin:4px 0 9px}.story p{margin:8px 0}.story .meta{font-size:12px;color:var(--muted)}.story .implication{border-left:3px solid var(--line);padding-left:13px;color:#444}
    .sources{display:grid;grid-template-columns:repeat(2,1fr);gap:0 22px}.sources a{color:var(--wine);font-weight:800}.sources li{padding:9px 0;border-bottom:1px solid var(--line)}
    .nav-inline{display:flex;gap:18px;flex-wrap:wrap;padding:12px 0;border-bottom:2px solid var(--ink)}.nav-inline a{color:var(--wine);font-weight:800;text-decoration:none}
    @media(max-width:760px){.sources{grid-template-columns:1fr}.story h3{font-size:19px}}</style></head><body><main class="shell"><header class="hero"><div class="eyebrow">AI CAPITAL / WEEKLY ARCHIVE</div><h1>周报目录</h1><p>按期次回看国内 AI 融资与资本运作线索</p></header><nav class="nav-inline"><a href="../">← 返回最新周报</a></nav><section class="section"><h2>已发布周报</h2><article class="story"><p class="meta">2026-10-19 00:00—2026-10-26 09:30 · 北京时间</p><h3><a href="2026-10-26.html">2026 年 10 月 26 日｜AI 生态雷达专题 ↗</a></h3><p>OpenAI 收购 Orchestra Bio；赛意信息算力合同与三季报；DeepInfer、模型分发和企业应用动态。</p></article><p class="note">下一期 2026 年 11 月 2 日采集完成后发布。</p></section><footer>目录只展示周报；逐日采集记录保存在本地。</footer></main></body></html>
