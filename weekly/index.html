<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI资本周报目录</title><style>
:root{--paper:#f7f5f0;--ink:#1b1d1e;--wine:#9b2237;--line:#d8d5cd;--muted:#666b6a}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 "Microsoft YaHei","PingFang SC",Arial,sans-serif}
.shell{max-width:1120px;margin:auto;padding:24px 26px 60px}.hero{background:#171c23;color:#fff;border-top:6px solid var(--wine);padding:40px 48px}
.eyebrow{font:700 11px Arial,sans-serif;letter-spacing:.19em;color:#ef9daf}.hero h1{font-size:clamp(36px,5vw,58px);line-height:1.1;margin:18px 0 12px}.hero p{margin:0;color:#d4d8d9}.hero .brand-title{margin:14px 0 10px;line-height:0}.hero .brand-title img{display:block;width:min(100%,420px);height:auto}
.strip{display:flex;gap:22px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding:14px 4px;color:var(--muted);font-size:12px}.strip b{color:var(--ink)}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:42px;padding-top:30px}.rail{align-self:start;position:sticky;top:18px}.rail strong{display:block;border-bottom:2px solid var(--ink);padding-bottom:9px;color:var(--wine);font:800 11px Arial,sans-serif;letter-spacing:.15em}
.rail a{display:block;border-bottom:1px solid var(--line);padding:10px 2px;color:var(--ink);font-weight:800;text-decoration:none}.rail a:hover,.source a:hover{color:var(--wine)}
.content h2{font-size:23px;line-height:1.35;margin:0 0 12px}.lead{font-size:21px;font-weight:800;line-height:1.5;margin:0 0 17px}.note{color:var(--muted);font-size:13px}.boundary{border-left:3px solid var(--wine);padding:6px 0 6px 16px;margin:22px 0 30px}
.section{border-top:2px solid var(--ink);padding-top:20px;margin-top:30px}.story{border-bottom:1px solid var(--line);padding:18px 0 22px}.story h3{font-size:22px;line-height:1.4;margin:4px 0 8px}.story h3 a{color:var(--ink);text-decoration:none}.story h3 a:hover{color:var(--wine)}.meta{font-size:12px;color:var(--muted);margin:0}.status{display:inline-block;background:#f1e1e4;color:#7e1f31;padding:2px 9px;font-size:11px;font-weight:800}.source a{color:var(--wine);font-weight:800}.empty{background:#fff;border:1px solid var(--line);padding:24px}
footer{border-top:2px solid var(--ink);margin-top:34px;padding-top:14px;color:var(--muted);font-size:12px}a:focus-visible{outline:2px solid var(--wine);outline-offset:3px}
@media(max-width:760px){.shell{padding:0 16px 35px}.hero{margin:0 -16px;padding:29px 22px}.layout{grid-template-columns:minmax(0,1fr);gap:12px}.rail,.content{min-width:0}.content,.story{overflow-wrap:anywhere}.rail{position:static}.rail a{display:inline-block;margin-right:20px}.lead{font-size:19px}.story h3{font-size:19px}}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.section-heading h2{margin:0}.export-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.export-button{border:1px solid var(--wine);background:var(--wine);color:#fff;font-family:inherit;font-size:13px;font-weight:800;line-height:1.3;padding:9px 13px;cursor:pointer}.export-button:hover{background:#751b2a}.export-button:disabled{opacity:.65;cursor:wait}.export-status{font-size:12px;color:var(--muted)}
</style></head><body><main class="shell"><header class="hero"><div class="eyebrow">AI CAPITAL / WEEKLY ARCHIVE</div><h1 class="brand-title"><img src="../title-zhoubao-mulu.png" alt="周報目錄" width="2172" height="724"></h1><p>按期次回看国内 AI 融资与资本运作线索</p></header><div class="strip"><a href="../">← 返回最新周报</a></div><section class="section"><h2>已发布周报</h2><ul><li><a href="2026-11-02.html">2026-11-02</a></li><li><a href="2026-10-26.html">2026-10-26</a></li></ul></section></main></body></html>
